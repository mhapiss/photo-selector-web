<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="description" content="Aplikasi pembuat galeri foto klien terbaik untuk fotografer Indonesia. Klien bisa memilih foto langsung dari Google Drive, dan mengirimkan daftarnya via WhatsApp tanpa perlu login atau upload ulang." />
    <meta name="keywords" content="photo selector, galeri klien, fotografer indonesia, google drive photo gallery, aplikasi fotografer, kirim foto klien, wedding photographer indonesia" />
    <meta name="author" content="Photo Selector" />
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" /></noscript>
    <title>Photo Selector - Buat Galeri Klien Langsung dari Google Drive</title>
    <meta property="og:title" content="Photo Selector - Galeri Klien Fotografer Profesional" />
    <meta property="og:description" content="Kirim galeri foto ke klien langsung dari Google Drive. Tanpa batas penyimpanan, tanpa upload ulang. Terima pilihan foto via WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Photo Selector",
      "description": "Platform pemilihan foto klien (client gallery) berbasis Google Drive untuk fotografer profesional di Indonesia.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "IDR"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
